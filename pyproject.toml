[project]
name = "lexivox"
version = "0.1.0"
description = "Private, offline audio transcription for Windows (inspired by Vibe)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1",
    "waitress>=3.0",
    "pywebview>=6.2",
    "sounddevice>=0.5.6",
    "pystray>=0.19.5",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
# Each machine installs only the engine(s) its hardware can use; see scripts/install.ps1.
cpu = ["faster-whisper>=1.2"]
# CTranslate2 4.x needs CUDA 12 cuBLAS and cuDNN 9 (about 1.3 GB, NVIDIA machines only).
nvidia = ["faster-whisper>=1.2", "nvidia-cublas-cu12>=12.4,<13", "nvidia-cudnn-cu12>=9,<10"]
intel = ["openvino-genai>=2026.4"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"
markers = ["integration: needs ffmpeg and a downloaded model"]
